# Wedding Card Generator — card.clixworks.co.tz
#
# Reference config from the migration spec.
# PREFERRED: derive the live file from the existing wedding.nardio.online server block
# instead (see deploy/MIGRATE-card.clixworks.co.tz.md, Phase 3) so any extra production
# directives it contains are preserved. Use this file only if that isn't possible, and first
# copy in anything the existing block has that this one lacks (extra locations, proxy
# headers, timeouts, IPv6 listen lines).
#
# Frontend: /var/www/card-generator/dist
# Backend:  127.0.0.1:8003
# Cert:     existing Cloudflare origin certificate for *.clixworks.co.tz

server {
    listen 80;
    server_name card.clixworks.co.tz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name card.clixworks.co.tz;

    client_max_body_size 10M;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/card-generator/dist;
    index index.html;

    # Trailing slash is REQUIRED. The backend mounts its routes at "/" (server/server.js),
    # so nginx must strip the /api/ prefix:  /api/verify  ->  http://127.0.0.1:8003/verify
    location /api/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
