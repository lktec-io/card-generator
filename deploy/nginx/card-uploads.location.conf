# ───────────────────────────────────────────────────────────────────────────
#  Serve generated invitation cards from persistent VPS storage.
#
#  Add these blocks INSIDE the existing
#      server { ... server_name card.clixworks.co.tz; ... }
#  block, ABOVE the generic `location / { try_files ... }`.
#
#  URL on the site                      →  file on disk
#  /uploads/cards/45/a8f31c72-….png     →  /var/www/card-generator/storage/cards/45/a8f31c72-….png
#  /uploads/cards/45/2200.png (older)   →  /var/www/card-generator/storage/cards/45/2200.png
#
#  Only storage/cards is reachable. The rest of storage/, the application code
#  and .env stay unreachable.
#
#  ── IMPORTANT, if you installed an earlier version of this file ───────────
#  The previous version wrapped a regex `location` inside a prefix `location`
#  and gave the inner one a plain `alias`. In nginx, an `alias` inside a REGEX
#  location must be built from that regex's captures; without them nginx does
#  not append the rest of the URI and the request resolves to the directory
#  itself. Replace the old block entirely with the one below.
#
#  To see what is actually installed right now:
#      sudo nginx -T | grep -n -A 12 'uploads/cards'
# ───────────────────────────────────────────────────────────────────────────

# ── Upload size ────────────────────────────────────────────────────────────
# Put this in the `server { }` block (not inside a location).
#
# nginx's default is 1 MB, and it refuses a larger upload with an HTML 413
# BEFORE the request ever reaches Node — so the application cannot explain the
# failure, and the browser only sees an error page. Bulk generation posts the
# card design (up to 10 MB) together with the guest list, so the limit must be
# comfortably above both.
#
#   client_max_body_size 12M;
#
# Check what is set now:  sudo nginx -T | grep -n client_max_body_size
# (If nothing is printed, the limit is the 1 MB default.)

# Exactly one shape is served:  /uploads/cards/<eventId>/<name>.<image ext>
#
#   $1  event id    digits only
#   $2  file name   must start alphanumeric and cannot contain "/", so neither
#                   ".." nor a subdirectory can ever be addressed
#   $3  extension   images only — nothing else in this tree is ever served
#
# The alias is built from those captures, which is what makes an aliased regex
# location resolve correctly.
location ~ ^/uploads/cards/([0-9]+)/([A-Za-z0-9][A-Za-z0-9._-]*)\.(png|jpe?g|webp)$ {
    alias /var/www/card-generator/storage/cards/$1/$2.$3;

    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;

    # New cards are named with a random token and a regenerated card gets a NEW
    # name, so a cached card can never become stale — "immutable" is safe here.
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
}

# Everything else under /uploads/ — a bare directory, a non-image, a probe for
# .env or a .php file — is refused. autoindex is off by default in nginx, and
# this makes certain no listing is ever produced.
location /uploads/ {
    autoindex off;
    return 404;
}

# Cards generated before the move to VPS storage are still recorded as
# /generated/<CODE>.png and are served by the API. Keep this until no row points
# at /generated/ any more (check with: server/scripts/verify-card-storage.js).
location /generated/ {
    proxy_pass http://127.0.0.1:8003/generated/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    expires 30d;
}
