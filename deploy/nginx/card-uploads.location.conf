# ───────────────────────────────────────────────────────────────────────────
#  Serve generated invitation cards from persistent VPS storage.
#
#  Add these two blocks INSIDE the existing
#      server { ... server_name card.clixworks.co.tz; ... }
#  block, ABOVE the generic `location / { try_files ... }` so the SPA fallback
#  cannot swallow image requests.
#
#  URL on the site          →  file on disk
#  /uploads/cards/12/345.png → /var/www/card-generator/storage/cards/12/345.png
#
#  Only storage/cards is exposed. The rest of storage/, the app code and .env
#  stay unreachable.
# ───────────────────────────────────────────────────────────────────────────

location /uploads/cards/ {
    alias /var/www/card-generator/storage/cards/;

    # images only — never serve anything else that lands in this tree
    location ~* ^/uploads/cards/.+\.(png|jpe?g|webp)$ {
        alias /var/www/card-generator/storage/cards/;
        try_files $uri =404;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    return 404;
}

# Cards generated before this migration are still recorded as /generated/<CODE>.png
# and are served by the API. Keep this until no row points at /generated/ any more
# (check with: server/scripts/verify-card-storage.js).
location /generated/ {
    proxy_pass http://127.0.0.1:8003/generated/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}
